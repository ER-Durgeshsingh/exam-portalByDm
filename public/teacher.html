<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a class="brand" href="/">Smart MCQ</a><nav><a href="dashboard.html">Student view</a><button class="btn" id="logoutBtn" type="button">Logout</button></nav></header>
<main class="content"><h1>Teacher Dashboard</h1><p>Create exams, add MCQ questions and view results for your own exams.</p>
<h2 class="section-title">Create exam</h2><form id="examForm" class="form-card compact"><label>Exam title<input name="title" required></label><label>Duration (minutes)<input name="duration" type="number" min="1" max="300" value="30" required></label><button class="btn">Create exam</button><p id="examMessage" class="message"></p></form>
<h2 class="section-title">Your exams</h2><div id="teacherExams" class="table-wrap">Loading...</div>
<h2 class="section-title">Add MCQ question</h2><form id="questionForm" class="form-card compact"><label>Exam ID<input name="exam_id" type="number" min="1" required></label><label>Question<input name="question" required></label><label>Option A<input name="option_a" required></label><label>Option B<input name="option_b" required></label><label>Option C<input name="option_c" required></label><label>Option D<input name="option_d" required></label><label>Correct answer<select name="correct_answer"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><button class="btn">Add question</button><p id="questionMessage" class="message"></p></form>
<h2 class="section-title">Student results (your exams)</h2><div id="teacherResults" class="table-wrap">Loading...</div></main><script src="js/teacher.js"></script></body></html>
